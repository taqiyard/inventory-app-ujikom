<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Aktivitas - Inventaris Peralatan Kantor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="index.css">
    <style>
        body {
            background-color: #1E1E1E;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #E4E4E4;
        }
        
        .navbar-custom {
            background: #252526;
            border-bottom: 1px solid #3C3C3C;
        }
        
        .sidebar {
            background: #252526;
            min-height: 100vh;
            padding-top: 20px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.05);
            position: fixed;
            left: 0;
            top: 60px;
            width: 250px;
        }
        
        .main-content {
            margin-left: 250px;
            margin-top: 60px;
            padding: 30px;
        }
        
        .sidebar-menu li a {
            display: block;
            padding: 15px 20px;
            color: #C5C5C5;
            text-decoration: none;
            border-left: 4px solid transparent;
            transition: all 0.3s;
        }
        
        .sidebar-menu li a:hover,
        .sidebar-menu li a.active {
            background-color: #2D2D30;
            border-left-color: #4FC3F7;
            color: #4FC3F7;
        }
        
        .card {
            background: #252526;
            border: 1px solid #3C3C3C;
            color: #E4E4E4;
        }
        
        .card-header {
            background: #2D2D30;
            border-bottom: 1px solid #3C3C3C;
        }
        
        .form-control {
            background: #2D2D30;
            border: 1px solid #3C3C3C;
            color: #E4E4E4;
        }
        
        .form-control:focus {
            background: #2D2D30;
            border-color: #4FC3F7;
            color: #E4E4E4;
        }
        
        .form-label {
            color: #E4E4E4;
        }
        
        .table {
            border-color: #3C3C3C;
            --bs-table-color: #E4E4E4;
            --bs-table-bg: transparent;
            --bs-table-hover-color: #E4E4E4;
            --bs-table-hover-bg: #3C3C3C;
            --bs-table-striped-color: #E4E4E4;
            --bs-table-striped-bg: #2D2D30;
            --bs-table-border-color: #444444;
        }
        
        .table thead.table-dark {
            background-color: #2D2D30;
            color: #4FC3F7;
            /* Memberikan warna aksen pada header agar lebih jelas */
            border-bottom: 2px solid #3C3C3C;
        }
        
        .table thead th {
            padding: 15px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }
        
        .table tbody td {
            padding: 12px 15px;
            vertical-align: middle;
        }
        
        .table thead.table-dark {
            background-color: #2D2D30;
            /* Darker header for better contrast */
            color: #E4E4E4;
        }
        
        .table thead.table-dark th {
            border-color: #3C3C3C;
            padding: 12px 15px;
            /* Adjust padding for headers */
        }
        
        .table tbody tr:nth-child(even) {
            background-color: #2D2D30;
            /* Zebra striping for even rows */
        }
        
        .table tbody tr:nth-child(odd) {
            background-color: #252526;
            /* Original background for odd rows */
        }
        
        .table tbody tr:hover {
            background-color: #3C3C3C;
            /* Highlight on hover */
            color: #E4E4E4;
        }
        
        .btn-primary {
            background: #4FC3F7;
            border: none;
            color: #1E1E1E;
        }
        
        .btn-primary:hover {
            background: #29B6F6;
            color: #1E1E1E;
        }
        
        .btn-success {
            background: #66BB6A;
            border: none;
        }
        
        .btn-success:hover {
            background: #56A862;
        }
        
        .btn-danger {
            background: #EF5350;
            border: none;
            color: white;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-inbox"></i> Inventaris Kantor
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="profil.html">
                            <i class="bi bi-person"></i> Profil
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="logout()">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="sidebar">
                <ul class="sidebar-menu">
                    <li><a href="index.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                    <li><a href="barang.html"><i class="bi bi-box"></i> Manajemen Barang</a></li>
                    <li><a href="peminjaman.html"><i class="bi bi-arrow-left-right"></i> Peminjaman Barang</a></li>
                    <li><a href="laporan.html"><i class="bi bi-bar-chart"></i> Laporan</a></li>
                    <li><a href="log-aktivitas.html" class="active"><i class="bi bi-clock-history"></i> Log Aktivitas</a></li>
                </ul>
            </div>

            <div class="main-content">
                <h1 class="mb-4">Log Aktivitas Sistem</h1>
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Riwayat Aktivitas Pengguna</h5>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>Waktu</th>
                                    <th>Pengguna</th>
                                    <th>Aktivitas</th>
                                </tr>
                            </thead>
                            <tbody id="logTableBody">
                                <tr>
                                    <td colspan="3" class="text-center">Memuat data...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        async function loadLogs() {
            try {
                const response = await fetch('http://localhost:3000/api/log-aktivitas', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const data = await response.json();
                const logs = data.logs || [];

                let html = '';
                logs.forEach(log => {
                    html += `
                        <tr>
                            <td class="text-info">${new Date(log.waktu).toLocaleString('id-ID')}</td>
                            <td><strong>${log.user_name}</strong></td>
                            <td>${log.aktivitas}</td>
                        </tr>`;
                });
                document.getElementById('logTableBody').innerHTML = html || '<tr><td colspan="3" class="text-center">Tidak ada log ditemukan</td></tr>';
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        loadLogs();
    </script>
</body>

</html>
