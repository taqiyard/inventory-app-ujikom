<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Barang - Inventaris Peralatan Kantor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="index.css">
    <style>
        body {
            background-color: #1E1E1E;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #E4E4E4;
        }
        
        .navbar-custom {
            background: #252526;
            border-bottom: 1px solid #3C3C3C;
        }
        
        .sidebar {
            background: #252526;
            min-height: 100vh;
            padding-top: 20px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.05);
            position: fixed;
            left: 0;
            top: 60px;
            width: 250px;
        }
        
        .main-content {
            margin-left: 250px;
            margin-top: 60px;
            padding: 30px;
        }
        
        .sidebar-menu li a {
            display: block;
            padding: 15px 20px;
            color: #C5C5C5;
            text-decoration: none;
            border-left: 4px solid transparent;
            transition: all 0.3s;
        }
        
        .sidebar-menu li a:hover,
        .sidebar-menu li a.active {
            background-color: #2D2D30;
            border-left-color: #4FC3F7;
            color: #4FC3F7;
        }
        
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .status-tersedia {
            background-color: rgba(102, 187, 106, 0.2);
            color: #66BB6A;
        }
        
        .status-dipinjam {
            background-color: rgba(255, 167, 38, 0.2);
            color: #FFA726;
        }
        
        .status-rusak {
            background-color: rgba(239, 83, 80, 0.2);
            color: #EF5350;
        }
        
        .card {
            background: #252526;
            border: 1px solid #3C3C3C;
            color: #E4E4E4;
        }
        
        .card-header {
            background: #2D2D30;
            border-bottom: 1px solid #3C3C3C;
        }
        
        .form-control {
            background: #2D2D30;
            border: 1px solid #3C3C3C;
            color: #E4E4E4;
        }
        
        .form-control:focus {
            background: #2D2D30;
            border-color: #4FC3F7;
            color: #E4E4E4;
        }
        
        .form-label {
            color: #E4E4E4;
        }
        
        .table {
            border-color: #3C3C3C;
            --bs-table-color: #E4E4E4;
            --bs-table-bg: transparent;
            --bs-table-hover-color: #E4E4E4;
            --bs-table-hover-bg: #3C3C3C;
            --bs-table-striped-color: #E4E4E4;
            --bs-table-striped-bg: #2D2D30;
            --bs-table-border-color: #3C3C3C;
        }
        
        .table tbody td {
            color: #E4E4E4 !important;
            border-color: #3C3C3C;
        }
        
        .table tbody tr:hover td {
            color: #E4E4E4 !important;
            background-color: #3C3C3C;
        }
        
        .table thead.table-dark {
            background-color: #2D2D30;
            /* Darker header for better contrast */
            color: #E4E4E4;
        }
        
        .table thead.table-dark th {
            border-color: #3C3C3C;
            padding: 12px 15px;
            /* Adjust padding for headers */
        }
        
        .table tbody tr:nth-child(even) {
            background-color: #2D2D30;
            /* Zebra striping for even rows */
        }
        
        .table tbody tr:nth-child(odd) {
            background-color: #252526;
            /* Original background for odd rows */
        }
        
        .table tbody tr:hover {
            background-color: #3C3C3C;
            /* Highlight on hover */
            color: #E4E4E4;
        }
        
        .btn-primary {
            background: #4FC3F7;
            border: none;
            color: #1E1E1E;
        }
        
        .btn-primary:hover {
            background: #29B6F6;
            color: #1E1E1E;
        }
        
        .btn-warning {
            background: #FFA726;
            border: none;
            color: #1E1E1E;
        }
        
        .btn-danger {
            background: #EF5350;
            border: none;
            color: white;
        }
        /* Modal Dark */
        
        .modal-content {
            background: #252526;
            border: 1px solid #3C3C3C;
            color: #E4E4E4;
        }
        
        .modal-header {
            background: #2D2D30;
            border-bottom: 1px solid #3C3C3C;
        }
        
        .modal-footer {
            background: #2D2D30;
            border-top: 1px solid #3C3C3C;
        }
        /* Form Select Dark */
        
        .form-select {
            background-color: #2D2D30;
            border: 1px solid #3C3C3C;
            color: #E4E4E4;
        }
        
        .form-select:focus {
            background-color: #2D2D30;
            border-color: #4FC3F7;
            color: #E4E4E4;
            box-shadow: 0 0 0 0.2rem rgba(79, 195, 247, 0.25);
        }
        /* Penting: override warna option di dropdown */
        
        .form-select option {
            background-color: #2D2D30;
            color: #E4E4E4;
        }
        /* btn-close agar terlihat di dark background */
        
        .btn-close {
            filter: invert(1);
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/dashboard">
                <i class="bi bi-inbox"></i> Inventaris Kantor
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/profil">
                            <i class="bi bi-person"></i> Profil
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="logout()">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="sidebar">
                <ul class="sidebar-menu">
                    <li>
                        <a href="/dashboard">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li>
                        <a href="/barang" class="active">
                            <i class="bi bi-box"></i> Manajemen Barang
                        </a>
                    </li>
                    <li>
                        <a href="/peminjaman">
                            <i class="bi bi-arrow-left-right"></i> Peminjaman Barang
                        </a>
                    </li>
                    <li>
                        <a href="/laporan">
                            <i class="bi bi-bar-chart"></i> Laporan
                        </a>
                    </li>
                    <li id="menuLog" style="display:none;">
                        <a href="/log-aktivitas">
                            <i class="bi bi-clock-history"></i> Log Aktivitas
                        </a>
                    </li>

                </ul>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>Manajemen Barang</h1>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#tambahBarangModal">
                            <i class="bi bi-plus-circle"></i> Tambah Barang
                        </button>
            </div>

            <!-- Search & Filter -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <input type="text" class="form-control" id="searchBarang" placeholder="Cari barang...">
                        </div>
                        <div class="col-md-6">
                            <select class="form-select" id="filterKategori">
                                        <option value="">Semua Kategori</option>
                                        <option value="Elektronik">Elektronik</option>
                                        <option value="Furniture">Furniture</option>
                                        <option value="Lainnya">Lainnya</option>
                                    </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="card">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Nama Barang</th>
                                <th>Kategori</th>
                                <th>Total</th>
                                <th>Tersedia</th>
                                <th>Dipinjam</th>
                                <th>Kondisi</th>
                                <th>Lokasi</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="barangTableBody">
                            <tr>
                                <td colspan="8" class="text-center text-muted">Memuat data...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    </div>
    </div>

    <!-- Modal Tambah/Edit Barang -->
    <div class="modal fade" id="tambahBarangModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Tambah Barang Baru</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="formBarang">
                    <div class="modal-body">
                        <input type="hidden" id="barangId">

                        <div class="mb-3">
                            <label for="namaBarang" class="form-label">Nama Barang</label>
                            <input type="text" class="form-control" id="namaBarang" required>
                        </div>

                        <div class="mb-3">
                            <label for="kategori" class="form-label">Kategori</label>
                            <select class="form-select" id="kategori" required>
                                <option value="">Pilih Kategori</option>
                                <option value="Elektronik">Elektronik</option>
                                <option value="Furniture">Furniture</option>
                                <option value="Lainnya">Lainnya</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="jumlah" class="form-label">Jumlah Total</label>
                            <input type="number" class="form-control" id="jumlah" min="1" required>
                        </div>

                        <div class="mb-3">
                            <label for="kondisi" class="form-label">Kondisi</label>
                            <select class="form-select" id="kondisi" required>
                                <option value="baik">Baik</option>
                                <option value="rusak">Rusak</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="lokasi" class="form-label">Lokasi</label>
                            <input type="text" class="form-control" id="lokasi" placeholder="Ruangan/Area" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary">Simpan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));

        if (!token) {
            window.location.href = '/login';
        }

        // Tampilkan menu Log Aktivitas jika user adalah admin
        if (user && user.role === 'admin') {
            document.getElementById('menuLog').style.display = 'block';
        }

        // Load barang data
        async function loadBarang(search = '', kategori = '') {
            try {
                let url = `http://localhost:3000/api/barang?search=${search}&kategori=${kategori}`;
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const data = await response.json();
                displayBarang(data);
            } catch (error) {
                console.error('Error loading barang:', error);
            }
        }

        function displayBarang(data) {
            let html = '';
            data.forEach(barang => {
                const jumlahDipinjam = barang.jumlah_total - barang.jumlah_tersedia;
                let kondisiClass = barang.kondisi === 'baik' ? 'status-tersedia' : 'status-rusak';

                html += `
                    <tr>
                        <td>${barang.nama_barang}</td>
                        <td>${barang.kategori}</td>
                        <td>${barang.jumlah_total}</td>
                        <td><span class="status-badge status-tersedia">${barang.jumlah_tersedia}</span></td>
                        <td><span class="status-badge status-dipinjam">${jumlahDipinjam}</span></td>
                        <td><span class="status-badge ${kondisiClass}">${barang.kondisi}</span></td>
                        <td>${barang.lokasi}</td>
                        <td>
                            <button class="btn btn-sm btn-warning" onclick="editBarang(${barang.id})">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="hapusBarang(${barang.id})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            if (data.length === 0) {
                html = '<tr><td colspan="8" class="text-center text-muted">Tidak ada data</td></tr>';
            }

            document.getElementById('barangTableBody').innerHTML = html;
        }

        // Handle search and filter
        document.getElementById('searchBarang').addEventListener('input', (e) => {
            loadBarang(e.target.value, document.getElementById('filterKategori').value);
        });

        document.getElementById('filterKategori').addEventListener('change', (e) => {
            loadBarang(document.getElementById('searchBarang').value, e.target.value);
        });

        // Handle Add/Edit Form
        document.getElementById('formBarang').addEventListener('submit', async(e) => {
            e.preventDefault();
            const id = document.getElementById('barangId').value;
            const data = {
                nama_barang: document.getElementById('namaBarang').value,
                kategori: document.getElementById('kategori').value,
                jumlah_total: document.getElementById('jumlah').value,
                kondisi: document.getElementById('kondisi').value,
                lokasi: document.getElementById('lokasi').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `http://localhost:3000/api/barang/${id}` : 'http://localhost:3000/api/barang';

            const response = await fetch(url, {
                method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                bootstrap.Modal.getInstance(document.getElementById('tambahBarangModal')).hide();
                document.getElementById('formBarang').reset();
                loadBarang();
            }
        });

        async function editBarang(id) {
            const response = await fetch(`http://localhost:3000/api/barang?id=${id}`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });
            const items = await response.json();
            const barang = items.find(b => b.id == id);

            if (barang) {
                document.getElementById('barangId').value = barang.id;
                document.getElementById('namaBarang').value = barang.nama_barang;
                document.getElementById('kategori').value = barang.kategori;
                document.getElementById('jumlah').value = barang.jumlah_total;
                document.getElementById('kondisi').value = barang.kondisi;
                document.getElementById('lokasi').value = barang.lokasi;
                document.getElementById('modalTitle').textContent = 'Edit Barang';
                new bootstrap.Modal(document.getElementById('tambahBarangModal')).show();
            }
        }

        async function hapusBarang(id) {
            if (confirm('Yakin ingin menghapus barang ini?')) {
                const response = await fetch(`http://localhost:3000/api/barang/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                if (response.ok) loadBarang();
            }
        }

        // Logout
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/dashboard';
        }

        // Initialize
        loadBarang();
    </script>
</body>

</html>
